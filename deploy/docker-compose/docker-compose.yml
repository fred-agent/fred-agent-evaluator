# The evaluator's API and worker as containers, against the infrastructure
# fred-deployment-factory already runs (PostgreSQL with its `evaluation`
# database, Keycloak, Temporal) and a Control Plane started on the host.
#
# Both containers share the host network, so they read the same
# config/configuration_prod.yaml and config/.env as `make run-prod` /
# `make run-worker-prod`: this is that setup, from the images. Linux only
# (network_mode: host).
#
#   docker compose -f deploy/docker-compose/docker-compose.yml up --build

x-evaluator: &evaluator
  network_mode: host
  environment:
    CONFIG_FILE: /app/config/configuration_prod.yaml
    ENV_FILE: /app/config/.env
  volumes:
    - ../../apps/fred-evaluation-backend/config:/app/config:ro

services:
  # Creates or updates the schema, then exits; the API waits for it.
  schema:
    <<: *evaluator
    build:
      context: ../../
      dockerfile: apps/fred-evaluation-backend/dockerfiles/Dockerfile-api
    image: fred-evaluation-api:local
    entrypoint: ["alembic", "upgrade", "head"]
    command: []

  api:
    <<: *evaluator
    image: fred-evaluation-api:local
    depends_on:
      schema:
        condition: service_completed_successfully

  worker:
    <<: *evaluator
    build:
      context: ../../
      dockerfile: apps/fred-evaluation-backend/dockerfiles/Dockerfile-worker
    image: fred-evaluation-worker:local
    depends_on:
      schema:
        condition: service_completed_successfully
