{{- $monitor := .Values.metricsService.serviceMonitor -}}
{{- if and .Values.metricsService.enabled $monitor.enabled (include "fred-evaluator.metricsPorts" .) }}
# Needs the Prometheus Operator CRDs.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fred-evaluator.labels" . | nindent 4 }}
    {{- with $monitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $monitor.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "fred-evaluator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/part-of: metrics
  endpoints:
    - port: metrics
      path: {{ $monitor.path }}
      interval: {{ $monitor.interval }}
      scrapeTimeout: {{ $monitor.scrapeTimeout }}
{{- end }}
