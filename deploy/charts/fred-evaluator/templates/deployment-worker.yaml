apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fred-evaluator.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "fred-evaluator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "fred-evaluator.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        {{- include "fred-evaluator.podAnnotations" . | nindent 8 }}
    spec:
      {{- include "fred-evaluator.podSpec" . | nindent 6 }}
      containers:
        # The image entrypoint runs the Temporal worker; no Service, and only
        # the `metrics` port when the Prometheus sink is on.
        - name: worker
          image: {{ include "fred-evaluator.image" (dict "image" .Values.worker.image "root" $) | quote }}
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          {{- include "fred-evaluator.env" . | nindent 10 }}
          {{- with include "fred-evaluator.metricsPorts" . }}
          ports:
            {{- . | trim | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
