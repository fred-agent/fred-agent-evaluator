server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  absolute_redirect off;

  location = /healthz {
    default_type text/plain;
    return 200 "ok";
  }

  # Fred's gateway forwards the whole /apps/evaluation prefix, bare form included.
  location = /apps/evaluation {
    add_header Cache-Control "no-store" always;
    try_files /apps/evaluation/index.html =404;
  }

  location = /apps/evaluation/config.json {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  # Content-hashed by Vite: cacheable, and a miss is a real 404.
  location /apps/evaluation/assets/ {
    try_files $uri =404;
  }

  # The app routes in memory; any other path under the prefix gets the shell.
  location /apps/evaluation/ {
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ /apps/evaluation/index.html;
  }
}
