[project]
name = "fred-deepeval-cli"
version = "0.1.4"
description = "External CLI for evaluating Fred agent turns via /agents/evaluate"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = []
dependencies = [
  "fred-sdk>=4.4.2",
  "fred-runtime>=4.4.2",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8.6",
  "basedpyright==1.31.0",
  "detect-secrets>=1.5.0",
  "pytest>=8.4.2",
  "pytest-cov>=6.2.1",
  "pytest-socket>=0.7.0",
  "ruff>=0.12.5",
]
eval = [
  "deepeval",
  "litellm",
  "python-dotenv",
  "rich>=13.0",
  "temporalio",
]

[project.scripts]
fred-deepeval-cli = "fred_deepeval_cli.cli.main:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fred_deepeval_cli*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]

[tool.uv.sources]
# Local path override for development against the monorepo's own fred-sdk /
# fred-runtime, sibling to this repo under ~/Fred. Keeps `uv run` / `uv sync`
# from silently reverting to the PyPI versions. The evaluator's worker image
# ignores these entries and resolves from PyPI, bounded by the floors above.
fred-sdk = { path = "../../../fred/libs/fred-sdk", editable = true }
fred-runtime = { path = "../../../fred/libs/fred-runtime", editable = true }

[tool.uv]
# Path-style editable installs (a .pth entry, not an import-hook finder) so
# basedpyright resolves the sibling fred-* sources, as in the backend.
config-settings = { editable_mode = "compat" }
